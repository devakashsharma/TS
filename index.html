<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
        /* Optional: Add a simple hover effect for better user feedback */
        .box-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
  </head>
  <body class="p-6 md:p-12 bg-gray-100 font-sans">
    <div class="min-h-screen flex items-center justify-center w-full">
      <div class="flex flex-col md:flex-row gap-8 w-full max-w-4xl justify-center">

        <a 
          href="game.html" 
          target="_blank" 
          class="box-link flex flex-1 items-center justify-center text-center p-12 bg-black text-white font-bold text-2xl uppercase rounded-lg shadow-lg transition duration-300 ease-in-out hover:bg-blue-600"
        >
          Game
        </a>

        <a 
          href="prop.html" 
          target="_blank" 
          class="box-link flex flex-1 items-center justify-center text-center p-12 bg-blue-600 text-white font-bold text-2xl uppercase rounded-lg shadow-lg transition duration-300 ease-in-out hover:bg-black"
        >
          Prop
        </a>

      </div>
    </div>
  </body>
</html>
